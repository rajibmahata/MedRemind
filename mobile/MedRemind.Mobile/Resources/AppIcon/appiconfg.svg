<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="456" height="456" viewBox="0 0 456 456" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <!-- Medical pill/capsule icon with clock symbol -->
    <g transform="translate(228, 228)">
        <!-- Pill capsule -->
        <g transform="rotate(-45)">
            <!-- Left half of capsule (white) -->
            <rect x="-90" y="-40" width="80" height="80" rx="40" ry="40" fill="#FFFFFF"/>
            
            <!-- Right half of capsule (lighter green) -->
            <rect x="10" y="-40" width="80" height="80" rx="40" ry="40" fill="#81C784"/>
            
            <!-- Middle divider line -->
            <line x1="10" y1="-40" x2="10" y2="40" stroke="#4CAF50" stroke-width="3"/>
        </g>
        
        <!-- Clock/reminder overlay -->
        <g transform="translate(50, -50)">
            <!-- Clock circle background -->
            <circle cx="0" cy="0" r="35" fill="#FFFFFF" stroke="#4CAF50" stroke-width="3"/>
            
            <!-- Clock hands -->
            <line x1="0" y1="0" x2="0" y2="-18" stroke="#4CAF50" stroke-width="4" stroke-linecap="round"/>
            <line x1="0" y1="0" x2="12" y2="0" stroke="#4CAF50" stroke-width="4" stroke-linecap="round"/>
            
            <!-- Clock center dot -->
            <circle cx="0" cy="0" r="3" fill="#4CAF50"/>
        </g>
        
        <!-- Small notification bell badge -->
        <g transform="translate(-60, -60)">
            <circle cx="0" cy="0" r="18" fill="#FF5722"/>
            <!-- Bell icon -->
            <path d="M -6,-2 L -6,0 C -6,3.3 -3.3,6 0,6 C 3.3,6 6,3.3 6,0 L 6,-2 L -6,-2 Z M 0,-8 C -2.2,-8 -4,-6.2 -4,-4 L -4,-2 L 4,-2 L 4,-4 C 4,-6.2 2.2,-8 0,-8 Z M -6,7 L 6,7" 
                  stroke="#FFFFFF" stroke-width="1.5" fill="none" stroke-linecap="round"/>
        </g>
    </g>
</svg>