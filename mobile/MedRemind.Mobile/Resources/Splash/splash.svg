<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="456" height="456" viewBox="0 0 456 456" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <!-- Splash screen with MedRemind branding -->
    <g transform="translate(228, 200)">
        <!-- Large pill capsule -->
        <g transform="rotate(-45)">
            <!-- Left half (white) -->
            <rect x="-60" y="-30" width="55" height="60" rx="30" ry="30" fill="#FFFFFF"/>
            <!-- Right half (green) -->
            <rect x="-5" y="-30" width="55" height="60" rx="30" ry="30" fill="#81C784"/>
            <!-- Divider -->
            <line x1="-5" y1="-30" x2="-5" y2="30" stroke="#4CAF50" stroke-width="2"/>
        </g>
        
        <!-- Clock overlay -->
        <g transform="translate(35, -35)">
            <circle cx="0" cy="0" r="25" fill="#FFFFFF" stroke="#4CAF50" stroke-width="2.5"/>
            <line x1="0" y1="0" x2="0" y2="-12" stroke="#4CAF50" stroke-width="3" stroke-linecap="round"/>
            <line x1="0" y1="0" x2="8" y2="0" stroke="#4CAF50" stroke-width="3" stroke-linecap="round"/>
            <circle cx="0" cy="0" r="2.5" fill="#4CAF50"/>
        </g>
    </g>
    
    <!-- App name - converted to paths for better compatibility -->
    <g transform="translate(228, 320)">
        <text x="0" y="0" font-family="sans-serif" font-size="42" font-weight="bold" fill="#FFFFFF" text-anchor="middle">
            MedRemind
        </text>
    </g>
    
    <!-- Tagline -->
    <g transform="translate(228, 360)">
        <text x="0" y="0" font-family="sans-serif" font-size="18" fill="#E8F5E9" text-anchor="middle">
            Never Miss a Dose
        </text>
    </g>
</svg>