
[project]
name = "medremind-python-api"
version = "1.0.0"
description = "CrewAI-based prescription parser microservice for MedRemind"
authors = [
    {name = "MedRemind Team"}
]
requires-python = ">=3.11"
dependencies = [
    "crewai>=0.76.7",
    "crewai-tools>=0.12.1",
    "langchain-openai>=0.3.7",
    "langchain-anthropic>=0.3.8",
    "langchain-core>=0.3.29",
    "langsmith>=0.2.0",
    "fastapi>=0.115.5",
    "uvicorn[standard]>=0.32.1",
    "pydantic>=2.10.3",
    "pydantic-settings>=2.6.1",
    "python-dotenv>=1.0.1",
    "httpx>=0.28.1",
    "openai>=1.57.2",
    "anthropic>=0.39.0",
    "python-multipart>=0.0.18",
    "aiofiles>=24.1.0",
    "PyMuPDF>=1.24.0",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
